name = "taption-trip-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
# 프롬프트에 계정 이름이 든 workers.dev 주소가 나가지 않게 회사 도메인을 붙인다(REV1110A05).
routes = [{ pattern = "trip.bokkiyaw.com", custom_domain = true }]
# 빌드 305 이전 앱이 쓰는 예전 주소도 함께 켜 둔다.
workers_dev = true
preview_urls = false

# KV는 대표님 계정에서 만든 뒤 id를 넣는다: `npx wrangler kv namespace create PLANS`
[[kv_namespaces]]
binding = "PLANS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# IP당 1분에 POST 20번까지(REV1110A02, SEC1110A03에서 5 → 20: 첫 실행의 등록·PIN·키·업로드가 한 번에 온다).
# 무료 KV 쓰기 한도를 한 사람이 다 쓰지 못하게 한다.
[[ratelimits]]
name = "POST_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# 카카오 검색 중계: IP당 1분에 60번(REV1110A03). 인증 전에 센다(REV1110A06). 키는 `npx wrangler secret put KAKAO_REST_API_KEY`로만 둔다.
[[ratelimits]]
name = "KAKAO_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

# 인증 요청 전체: IP당 1분에 120번(SEC1110A02). GET·DELETE·MCP 읽기도 받는다. 카카오는 KAKAO_LIMIT만 쓴다.
[[ratelimits]]
name = "REQUEST_LIMIT"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 120
  period = 60

# 서버 전체가 하루에 쓰는 KV 쓰기 예산(REV1110A06). 무료 요금제는 하루 1,000건이라 900에서 멈추고 429를 준다.
# 유료 요금제로 바꾸면 이 값을 올린다.
[vars]
KV_DAILY_WRITE_BUDGET = "900"

# 주인 키마다 하나인 Durable Object(SEC1110A02): 키 목록·영구 폐기 표시·명령 큐·24시간 한도·PIN 시도·요청 예산·카카오 하루 수.
# SQLite 저장소 DO라 Workers 무료 요금제에서 쓸 수 있다. 이 migration은 처음 배포할 때 한 번 적용되고 되돌릴 수 없다.
[[durable_objects.bindings]]
name = "USER_STATE"
class_name = "UserState"

[[migrations]]
tag = "v1-user-state"
new_sqlite_classes = ["UserState"]
