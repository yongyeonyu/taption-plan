name = "taption-trip-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
# 프롬프트에 계정 이름이 든 workers.dev 주소가 나가지 않게 회사 도메인을 붙인다(REV1110A05).
routes = [{ pattern = "trip.bokkiyaw.com", custom_domain = true }]
# 빌드 305 이전 앱이 쓰는 예전 주소도 함께 켜 둔다.
workers_dev = true
preview_urls = false

# 요청 기록에 정류장 좌표·주소가 남지 않게 Workers Logs를 끈다(대표 결정 2026-11-18). 디버깅이 급할 때만 잠깐 켰다가 끈다.
[observability]
enabled = false

# D1R1119A01: 저장소는 D1이다. 만든 뒤 실제 database_id는 git에 없는 `wrangler.local.toml`에만 넣는다
# (`npx wrangler d1 create taption-trip-relay`). 이 파일에는 자리표시자만 둔다.
[[d1_databases]]
binding = "RELAY_DB"
database_name = "taption-trip-relay"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# R2PUB1119A01: 모두에게 같은 공용 공지·정적 데이터(POI 팩·모델)를 읽기 전용으로 주는 R2 버킷. Worker는 읽기만 한다.
# 버킷은 대표가 `npx wrangler r2 bucket create taption-trip-public`로 만들고, git에 없는 `wrangler.local.toml`에도 같은 블록을 넣는다.
# 바인딩이 없어도 코드는 503이 아니라 안전한 빈 응답(`/public/announcements`)을 준다. 로컬 미리보기는 R2 없이 돈다(preview_bucket_name 없음).
[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "taption-trip-public"

# 옛 KV(PLANS) 바인딩은 D1R1119A02에서 뗐다(2026-11-19, 남은 키 133개를 D1로 복사한 뒤). 코드는 `env.PLANS`가 없어도 D1만으로 돈다.
# IP당 1분에 POST 20번까지(REV1110A02, SEC1110A03에서 5 → 20: 첫 실행의 등록·PIN·키·업로드가 한 번에 온다).
# 무료 저장소(D1) 쓰기 한도를 한 사람이 다 쓰지 못하게 한다.
[[ratelimits]]
name = "POST_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# 카카오 검색 중계: IP당 1분에 60번(REV1110A03). 인증 전에 센다(REV1110A06). 키는 `npx wrangler secret put KAKAO_REST_API_KEY`로만 둔다.
[[ratelimits]]
name = "KAKAO_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

# 인증 요청 전체: IP당 1분에 120번(SEC1110A02). GET·DELETE·MCP 읽기도 받는다. 카카오는 KAKAO_LIMIT만 쓴다.
[[ratelimits]]
name = "REQUEST_LIMIT"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 120
  period = 60

# 서버 전체가 하루에 쓰는 저장소 쓰기 예산(REV1110A06, D1R1119A01). D1 무료 요금제는 하루 10만 행 쓰기라 80000에서 멈추고 429를 준다.
# (변수 이름의 KV는 옛 이름 그대로.) 유료 요금제로 바꾸면 이 값을 올린다.
[vars]
KV_DAILY_WRITE_BUDGET = "80000"

# 주인 키마다 하나인 Durable Object(SEC1110A02): 키 목록·영구 폐기 표시·명령 큐·24시간 한도·PIN 시도·요청 예산·카카오 하루 수.
# SQLite 저장소 DO라 Workers 무료 요금제에서 쓸 수 있다. 이 migration은 처음 배포할 때 한 번 적용되고 되돌릴 수 없다.
[[durable_objects.bindings]]
name = "USER_STATE"
class_name = "UserState"

[[migrations]]
tag = "v1-user-state"
new_sqlite_classes = ["UserState"]

# 여행 공유 방(TSH1114A26): 방마다 하나인 Durable Object. 암호화된 항목·잠금·참여자 검증값을 두고 WebSocket(Hibernation)을 받는다.
# 새 클래스라 migration 태그를 하나 더한다. 처음 배포할 때 한 번 적용되고 되돌릴 수 없다.
[[durable_objects.bindings]]
name = "SHARE_ROOM"
class_name = "ShareRoom"

[[migrations]]
tag = "v2-share-room"
new_sqlite_classes = ["ShareRoom"]
